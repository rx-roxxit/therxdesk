# Selling mode for the dev stack, merged on top of compose.yaml and
# compose.override.yaml by selling.sh (through env.sh's `compose`). .env is not
# edited: container env wins over .env in Laravel, and php-fpm keeps it
# (clear_env = no in the image).
#
#   - app runs with SELF_HOSTED=false and the webhook signing secret of the
#     Stripe CLI listener, read from a mode-600 file selling.sh writes.
#   - stripe forwards the sandbox's events (every snapshot event, the v1
#     events Cashier reads) to Cashier's /stripe/webhook.
#     ${STRIPE_SECRET} comes from the project's .env (compose interpolation).
#     Its log prints the signing secret: read it through `selling.sh logs`.
#   - heartbeat is a local receiver for the five-minute heartbeat job, so the
#     queue pings a dev service instead of Better Stack. `selling.sh heartbeat`
#     prints its log.

services:
    app:
        environment:
            SELF_HOSTED: 'false'
            RXDESK_ALERT_RECIPIENT: admin@therxdesk.com
            RXDESK_HEARTBEAT_URL: http://heartbeat:8080/hb
            RXDESK_BACKUP_HEARTBEAT_URL: http://heartbeat:8080/backup-hb
            # Dev-only signing secret so the webhook can be exercised locally.
            NIGHTWATCH_WEBHOOK_SECRET: verify-nightwatch-secret
            # Dev-only fake LinkedIn app credentials. Availability treats a
            # network as installed only when its credentials are filled, and
            # the fixture channel (plus the availability journey) needs
            # LinkedIn installed so its switch can be flipped. Never real.
            LINKEDIN_CLIENT_ID: verify-linkedin-client-id
            LINKEDIN_CLIENT_SECRET: verify-linkedin-client-secret
            # Dev-only fake media credentials, for the same reason: the
            # composer's pickers and Drive backup are installed (and their
            # switches can be flipped) only while their keys are filled. The
            # services-off journey flips them off and checks the composer.
            # Never real, and never used to reach a provider in a journey.
            UNSPLASH_ACCESS_KEY: verify-unsplash-key
            CANVA_CLIENT_ID: verify-canva-client-id
            CANVA_CLIENT_SECRET: verify-canva-client-secret
            GOOGLE_MEDIA_CLIENT_ID: verify-google-media-client-id
            GOOGLE_MEDIA_CLIENT_SECRET: verify-google-media-client-secret
            GOOGLE_MEDIA_REDIRECT: http://localhost:8000/integrations/google/callback
            GOOGLE_MEDIA_BACKUP_REDIRECT: http://localhost:8000/settings/preferences/drive/callback
            GOOGLE_MEDIA_API_KEY: verify-google-media-api-key
            GOOGLE_MEDIA_APP_ID: verify-google-media-app-id
            GOOGLE_PHOTOS_ENABLED: 'true'
        env_file:
            - path: ${HOME}/.cache/verify-therxdesk/state/stripe-webhook.env
              required: true
            - path: ${HOME}/.cache/verify-therxdesk/state/internal-api.env
              required: true

    heartbeat:
        image: mendhak/http-https-echo:31
        environment:
            HTTP_PORT: '8080'
        depends_on:
            app:
                condition: service_started
        restart: unless-stopped

    stripe:
        image: stripe/stripe-cli:v1.55.14
        command: ['listen', '--all-snapshot', '--forward-to', 'http://app/stripe/webhook']
        environment:
            STRIPE_API_KEY: ${STRIPE_SECRET:?STRIPE_SECRET is empty in .env}
        depends_on:
            app:
                condition: service_started
        restart: unless-stopped
